version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes: [pg-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    image: ghcr.io/craaaazyboy/vpn_tg_bot:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./secrets/id_ed25519:/run/secrets/vpn_ssh_key:ro

volumes:
  pg-data:
