version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=bot
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASS}
    volumes: [pg-data:/var/lib/postgresql/data]

  bot:
    build: ./bot
    env_file: .env
    depends_on: [postgres]

volumes:
  pg-data: