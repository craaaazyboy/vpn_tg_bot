name: CI/CD

on:
  push:
    branches:
      - main
      - stage
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev, stage, prod, all)"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - stage
          - prod
          - all

env:
  IMAGE: ghcr.io/craaaazyboy/vpn_tg_bot

jobs:
  build-deploy:
    name: Build & Deploy (${{ matrix.env }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: vpn-tg-bot-${{ matrix.env }}
      cancel-in-progress: false
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == matrix.env || github.event.inputs.environment == 'all')) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', matrix.branch))
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            branch: dev
            environment_name: dev
            tag_suffix: dev
            compose_file: docker-compose.prod.yml
            server_path: /opt/vpn-tg-bot/dev/vpn_tg_bot
            ssh_host_secret: SSH_HOST_DEV
            ssh_key_secret: SSH_KEY_DEV
            ssh_port_secret: SSH_PORT_DEV
            ssh_user_secret: SSH_USER_DEV
            ghcr_read_secret: GHCR_READ_TOKEN_DEV
            gh_user_secret: GH_USER_DEV

          - env: stage
            branch: stage
            environment_name: stage
            tag_suffix: stage
            compose_file: docker-compose.prod.yml
            server_path: /opt/vpn-tg-bot/stage/vpn_tg_bot
            ssh_host_secret: SSH_HOST_STAGE
            ssh_key_secret: SSH_KEY_STAGE
            ssh_port_secret: SSH_PORT_STAGE
            ssh_user_secret: SSH_USER_STAGE
            ghcr_read_secret: GHCR_READ_TOKEN_STAGE
            gh_user_secret: GH_USER_STAGE

          - env: prod
            branch: main
            environment_name: production
            tag_suffix: prod
            compose_file: docker-compose.prod.yml
            server_path: /opt/vpn-tg-bot/prod/vpn_tg_bot
            ssh_host_secret: SSH_HOST
            ssh_key_secret: SSH_KEY
            ssh_port_secret: SSH_PORT
            ssh_user_secret: SSH_USER
            ghcr_read_secret: GHCR_READ_TOKEN
            gh_user_secret: GH_USER

    environment:
      name: ${{ matrix.environment_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        run: |
          echo "TAG_SHA=${GITHUB_SHA}-${{ matrix.tag_suffix }}" >> $GITHUB_OUTPUT
          echo "TAG_LATEST=${{ matrix.tag_suffix }}-latest" >> $GITHUB_OUTPUT

      - name: Login to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.TAG_LATEST }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.TAG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate infra secrets for ${{ matrix.env }}
        run: |
          test -n "${{ secrets[matrix.ssh_host_secret] }}" || (echo "Missing ${{ matrix.ssh_host_secret }}" && exit 1)
          test -n "${{ secrets[matrix.ssh_key_secret] }}"  || (echo "Missing ${{ matrix.ssh_key_secret }}" && exit 1)
          test -n "${{ secrets[matrix.ghcr_read_secret] }}" || (echo "Missing ${{ matrix.ghcr_read_secret }}" && exit 1)
          test -n "${{ secrets[matrix.gh_user_secret] }}" || (echo "Missing ${{ matrix.gh_user_secret }} (GitHub username)" && exit 1)

      - name: Validate app env secrets for ${{ matrix.env }}
        run: |
          test -n "${{ secrets.BOT_TOKEN }}" || (echo "Missing BOT_TOKEN in Environment secrets" && exit 1)
          test -n "${{ secrets.PG_USER }}" || (echo "Missing PG_USER in Environment secrets" && exit 1)
          test -n "${{ secrets.PG_PASS }}" || (echo "Missing PG_PASS in Environment secrets" && exit 1)
          test -n "${{ secrets.WG_JWT }}" || (echo "Missing WG_JWT in Environment secrets" && exit 1)
          test -n "${{ secrets.WG_SSH_HOST }}" || (echo "Missing WG_SSH_HOST in Environment secrets" && exit 1)
          test -n "${{ secrets.WG_SSH_USER }}" || (echo "Missing WG_SSH_USER in Environment secrets" && exit 1)
          test -n "${{ secrets.WG_SSH_PRIVATE_KEY_B64 }}" || (echo "Missing WG_SSH_PRIVATE_KEY_B64 in Environment secrets" && exit 1)

      - name: Deploy over SSH (${{ matrix.env }})
        uses: appleboy/ssh-action@v1.0.0
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}

          WG_API_URL: ${{ secrets.WG_API_URL }}
          WG_JWT: ${{ secrets.WG_JWT }}
          WG_HOST: ${{ secrets.WG_HOST }}
          WG_PORT: ${{ secrets.WG_PORT }}

          WG_SSH_HOST: ${{ secrets.WG_SSH_HOST }}
          WG_SSH_USER: ${{ secrets.WG_SSH_USER }}
          WG_SSH_PRIVATE_KEY_B64: ${{ secrets.WG_SSH_PRIVATE_KEY_B64 }}
        with:
          host: ${{ secrets[matrix.ssh_host_secret] }}
          username: ${{ secrets[matrix.ssh_user_secret] || 'root' }}
          key: ${{ secrets[matrix.ssh_key_secret] }}
          port: ${{ secrets[matrix.ssh_port_secret] || 22 }}
          envs: BOT_TOKEN,ADMIN_ID,PG_USER,PG_PASS,WG_API_URL,WG_JWT,WG_HOST,WG_PORT,WG_SSH_HOST,WG_SSH_USER,WG_SSH_PRIVATE_KEY_B64
          script: |
            set -euo pipefail
            cd ${{ matrix.server_path }}

            git fetch origin
            git checkout ${{ matrix.branch }}
            git reset --hard origin/${{ matrix.branch }}

            # 1) ключ WG (как "docker secret" файл на сервере, генерится автоматом)
            umask 077
            mkdir -p secrets
            echo "$WG_SSH_PRIVATE_KEY_B64" | base64 -d > secrets/id_ed25519
            chmod 600 secrets/id_ed25519

            # 2) генерим .env (на сервере руками больше не правишь)
            umask 077
            cat > .env <<EOF
            BOT_TOKEN=${BOT_TOKEN}
            ADMIN_ID=${ADMIN_ID}

            PG_USER=${PG_USER}
            PG_PASS=${PG_PASS}
            DATABASE_URL=postgresql://${PG_USER}:${PG_PASS}@db:5432/bot

            WG_API_URL=${WG_API_URL}
            WG_JWT=${WG_JWT}
            WG_HOST=${WG_HOST}
            WG_PORT=${WG_PORT}

            WG_SSH_HOST=${WG_SSH_HOST}
            WG_SSH_USER=${WG_SSH_USER}
            WG_SSH_KEY=/run/secrets/vpn_ssh_key
            EOF

            # 3) pull + up
            echo "${{ secrets[matrix.ghcr_read_secret] }}" | docker login ghcr.io -u "${{ secrets[matrix.gh_user_secret] }}" --password-stdin
            IMAGE=${IMAGE} TAG=${{ steps.meta.outputs.TAG_SHA }} docker compose -f ${{ matrix.compose_file }} pull
            IMAGE=${IMAGE} TAG=${{ steps.meta.outputs.TAG_SHA }} docker compose -f ${{ matrix.compose_file }} up -d --remove-orphans
            docker image prune -f
