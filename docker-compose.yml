services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    depends_on: [db]
    restart: unless-stopped
    volumes:
      - ./secrets/id_ed25519:/run/secrets/vpn_ssh_key:ro

  web:
    build: ./bot
    env_file: .env
    depends_on: [db]
    restart: unless-stopped
    command: ["python", "web_server.py"]   # <-- замени на реальное имя файла
    environment:
      WEB_PORT: "8080"
    ports:
      - "18080:8080"

volumes:
  pg-data:
